<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="ground" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#2e2413"/>
      <stop offset="45%" stop-color="#16120b"/>
      <stop offset="100%" stop-color="#060504"/>
    </radialGradient>

    <linearGradient id="gold" x1="0%" y1="0%" x2="15%" y2="100%">
      <stop offset="0%" stop-color="#FFF4CF"/>
      <stop offset="22%" stop-color="#F0D98A"/>
      <stop offset="52%" stop-color="#C9A227"/>
      <stop offset="78%" stop-color="#8A6B18"/>
      <stop offset="100%" stop-color="#5C4410"/>
    </linearGradient>

    <linearGradient id="goldRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E6"/>
      <stop offset="40%" stop-color="#D9B23A"/>
      <stop offset="100%" stop-color="#6B5211"/>
    </linearGradient>

    <radialGradient id="grace" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE9A8" stop-opacity="0.7"/>
      <stop offset="30%" stop-color="#E8C14E" stop-opacity="0.3"/>
      <stop offset="65%" stop-color="#C9A227" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="haze" cx="50%" cy="78%" r="60%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <!-- Gold leaf is never flat; a little noise keeps it from looking like plastic. -->
    <filter id="leaf" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer result="grain">
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
      <feComposite in="grain" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#ground)"/>
  <rect width="512" height="512" rx="110" fill="url(#haze)"/>

  <!-- Outer ring of the table, drawn as two rims so it reads as a raised edge. -->
  <circle cx="256" cy="256" r="188" fill="none" stroke="#0a0806" stroke-width="20" opacity="0.85"/>
  <circle cx="256" cy="256" r="188" fill="none" stroke="url(#goldRim)" stroke-width="7"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="#C9A227" stroke-width="1.2" opacity="0.4"/>
  <circle cx="256" cy="256" r="199" fill="none" stroke="#C9A227" stroke-width="1" opacity="0.22"/>

  <!-- Eight seats, each a small gilded boss with a dark socket behind it. -->
  <g>
    <g fill="#0a0806">
      <circle cx="256" cy="68"  r="17"/><circle cx="389" cy="123" r="17"/>
      <circle cx="444" cy="256" r="17"/><circle cx="389" cy="389" r="17"/>
      <circle cx="256" cy="444" r="17"/><circle cx="123" cy="389" r="17"/>
      <circle cx="68"  cy="256" r="17"/><circle cx="123" cy="123" r="17"/>
    </g>
    <g fill="url(#goldRim)">
      <circle cx="256" cy="68"  r="12"/><circle cx="389" cy="123" r="12"/>
      <circle cx="444" cy="256" r="12"/><circle cx="389" cy="389" r="12"/>
      <circle cx="256" cy="444" r="12"/><circle cx="123" cy="389" r="12"/>
      <circle cx="68"  cy="256" r="12"/><circle cx="123" cy="123" r="12"/>
    </g>
    <g fill="#FFF6D8" opacity="0.75">
      <circle cx="252" cy="64"  r="3.4"/><circle cx="385" cy="119" r="3.4"/>
      <circle cx="440" cy="252" r="3.4"/><circle cx="385" cy="385" r="3.4"/>
      <circle cx="252" cy="440" r="3.4"/><circle cx="119" cy="385" r="3.4"/>
      <circle cx="64"  cy="252" r="3.4"/><circle cx="119" cy="119" r="3.4"/>
    </g>
  </g>

  <!-- Grace bloom behind the tree. Kept low so the gold reads as metal, not light. -->
  <circle cx="256" cy="250" r="140" fill="url(#grace)" opacity="0.42" filter="url(#softer)"/>

  <!-- The tree. Trunk first, then boughs thinning outward. -->
  <g>
    <g stroke="url(#gold)" stroke-linecap="round" fill="none">
      <path d="M256 386 L256 250" stroke-width="19"/>
      <path d="M256 300 L196 240 M256 300 L316 240" stroke-width="13.5"/>
      <path d="M256 258 L206 206 M256 258 L306 206" stroke-width="10"/>
      <path d="M256 258 L256 158" stroke-width="9"/>
      <path d="M196 240 L162 196 M316 240 L350 196" stroke-width="8"/>
      <path d="M206 206 L182 168 M306 206 L330 168" stroke-width="6.2"/>
      <path d="M162 196 L142 162 M350 196 L370 162" stroke-width="4.6"/>
      <path d="M256 200 L222 160 M256 200 L290 160" stroke-width="5"/>
      <path d="M182 168 L166 140 M330 168 L346 140" stroke-width="3.4"/>
      <path d="M222 160 L208 132 M290 160 L304 132" stroke-width="3"/>
      <path d="M256 158 L256 126" stroke-width="4"/>
      <path d="M142 162 L130 140 M370 162 L382 140" stroke-width="2.4"/>
    </g>

    <!-- Roots gripping the tabletop. -->
    <g stroke="url(#gold)" stroke-linecap="round" fill="none" opacity="0.92">
      <path d="M256 386 L198 414 M256 386 L314 414" stroke-width="11"/>
      <path d="M198 414 L156 424 M314 414 L356 424" stroke-width="7"/>
      <path d="M156 424 L128 418 M356 424 L384 418" stroke-width="4.4"/>
      <path d="M256 386 L256 420" stroke-width="6"/>
    </g>
  </g>

  <!-- Highlight along the lit side of the trunk. -->
  <path d="M250 384 L250 254" stroke="#FFF6D8" stroke-width="3" stroke-linecap="round"
        fill="none" opacity="0.5"/>

  <!-- Motes of grace drifting up through the canopy. -->
  <g fill="#FFF6D8">
    <circle cx="190" cy="128" r="4.2" opacity="0.95"/>
    <circle cx="330" cy="146" r="3.2" opacity="0.8"/>
    <circle cx="232" cy="104" r="2.6" opacity="0.85"/>
    <circle cx="296" cy="116" r="2.2" opacity="0.65"/>
    <circle cx="164" cy="176" r="2.4" opacity="0.6"/>
    <circle cx="356" cy="188" r="2" opacity="0.55"/>
    <circle cx="270" cy="88"  r="1.8" opacity="0.7"/>
  </g>
  <g fill="#FFE9A8" filter="url(#soft)" opacity="0.7">
    <circle cx="190" cy="128" r="7"/>
    <circle cx="330" cy="146" r="5.5"/>
    <circle cx="232" cy="104" r="4.5"/>
  </g>

  <!-- Inner bevel on the plate edge so the whole thing sits in the frame. -->
  <rect x="4" y="4" width="504" height="504" rx="107" fill="none"
        stroke="#C9A227" stroke-width="1.5" opacity="0.28"/>
</svg>
