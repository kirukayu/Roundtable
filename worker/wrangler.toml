# The answering service behind the in-game overlay.
#
# Keys are never in this file. They are set with `wrangler secret put`, which
# stores them on Cloudflare and keeps them out of a repository that is public.
#
#   wrangler secret put GROQ_KEY
#   wrangler secret put GEMINI_KEY
#   wrangler secret put MISTRAL_KEY
#   wrangler secret put OPENROUTER_KEY
#   wrangler secret put NVIDIA_KEY

name = "roundtable-ask"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Cloudflare's own models, as the last line of defence when every hosted
# provider is rate-limited. No key: the binding is the credential.
[ai]
binding = "AI"

# Counting requests in the isolate does not work: Cloudflare spreads traffic
# across isolates and each one starts from zero, so sixteen rapid calls sailed
# through a cap of twelve. This binding is backed by the same machinery as
# Cloudflare's own rate limiting rules and is shared across the location.
[[ratelimits]]
name = "PER_MINUTE"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 12
  period = 60

# A slower, wider net: bursts are fine, an afternoon of them is not.
[[ratelimits]]
name = "SUSTAINED"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 90
  period = 60

[observability]
enabled = true
